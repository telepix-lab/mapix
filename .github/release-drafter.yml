name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '✨ Features'
    labels: [feature, enhancement]
  - title: '🐛 Fixes'
    labels: [fix, bug]
  - title: '♻️ Refactoring'
    labels: [refactor]
  - title: '📚 Docs'
    labels: [docs]
  - title: '🛠 Chore'
    labels: [chore, dependencies]

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'
no-changes-template: '- No user-facing changes'

version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, refactor, docs, chore, dependencies]
  default: patch

# Labels are applied from the branch name, matching the convention already used
# in satchat (feat/…, fix/…, refactor/…, chore/…).
autolabeler:
  - label: feature
    branch: ['/^feat(ure)?[/-]/']
  - label: fix
    branch: ['/^(fix|hotfix|bugfix)[/-]/']
  - label: refactor
    branch: ['/^refactor[/-]/']
  - label: docs
    branch: ['/^docs?[/-]/']
  - label: chore
    branch: ['/^chore[/-]/']
  - label: breaking
    title: ['/BREAKING/i']

template: |
  ## What changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
