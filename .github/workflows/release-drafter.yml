name: Release Drafter

on:
  push:
    branches: [main]
  # Label pull requests as they are opened so the draft groups them correctly.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  draft:
    permissions:
      contents: write # write the draft release
      pull-requests: write # apply autolabels
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          # Only update the draft once a change lands on main; on pull_request
          # events this run exists to apply labels.
          disable-releaser: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
